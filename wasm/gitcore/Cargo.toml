[package]
name = "gitcore"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
miniz_oxide = "0.8"
sha1 = { version = "0.10", default-features = false }
crc32fast = { version = "1", default-features = false }

[profile.release]
opt-level = 3
lto = true
